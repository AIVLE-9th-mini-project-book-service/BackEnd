version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/backend-project
permissions:
  - object: /var/www/backend-project
    pattern: '**'
    mode: '0755'        
    owner: root       
    group: root     
    type:              
      - file
      - directory
hooks:
  AfterInstall:
    - location: scripts/deploy.sh
      timeout: 300