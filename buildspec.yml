version: 0.2

phases:
  install:
    runtime-versions:
      java: 17
  pre_build:
    commands:
      - echo "빌드 시작"
      - docker run -d -p 3306:3306 --name mysql-db -e MYSQL_ROOT_PASSWORD=aivle -e MYSQL_DATABASE=mini5 mysql:8.0
      - sleep 15
      - chmod +x ./gradlew
  build:
    commands:
      - ./gradlew clean build
  post_build:
    commands:
      - echo "빌드 완료"
      - ls -l build/libs/

artifacts:
  files:
    - 'build/libs/*.jar'