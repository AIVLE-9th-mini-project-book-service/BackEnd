apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-container
        image: 879772956301.dkr.ecr.us-east-1.amazonaws.com/user134-backend-repo:latest 
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "mysql-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          value: "root"          
        - name: DB_PASSWORD
          value: "password1234"  
        - name: DB_NAME
          value: "bookdb"        
